<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🎃 Gold Empire Clicker 👻</title>

<!-- Put logo.png in the same folder as this file -->
<link rel="icon" type="image/png" href="logo.png">

<style>

body{
    margin:0;
    min-height:100vh;
    font-family:Segoe UI,sans-serif;
    text-align:center;
    color:white;
    background:
    linear-gradient(
        180deg,
        #080808,
        #1a0e00,
        #2d1600
    );
}

h1{
    color:#ff8c00;
    text-shadow:
    0 0 10px #ff8c00,
    0 0 20px #ff8c00,
    0 0 40px orange;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:20px;
}

.panel{
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(10px);
    border-radius:20px;
    padding:15px;
    margin:15px;
    box-shadow:
    0 0 20px rgba(255,140,0,.15);
}

.stats{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:15px;
}

.card{
    min-width:180px;
}

.mine{
    width:180px;
    height:180px;
    font-size:60px;
    border:none;
    border-radius:50%;
    cursor:pointer;
    background:
    linear-gradient(
        #ff8c00,
        #ff4500
    );
    box-shadow:
    0 0 30px orange;
    transition:.2s;
}

.mine:hover{
    transform:scale(1.08);
}

.shopBtn{
    width:250px;
    padding:12px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    background:
    linear-gradient(
        45deg,
        #ff6a00,
        #ff9d00
    );
    color:white;
    margin:5px;
}

.rebirth{
    background:
    linear-gradient(
        45deg,
        purple,
        deeppink
    );
    color:white;
    border:none;
    padding:12px;
    border-radius:12px;
    cursor:pointer;
}

.achievement{
    color:lime;
    margin:5px;
}

.floatText{
    position:absolute;
    color:gold;
    font-weight:bold;
    pointer-events:none;
    animation:floatUp 1s linear forwards;
}

@keyframes floatUp{
    from{
        opacity:1;
        transform:translateY(0);
    }
    to{
        opacity:0;
        transform:translateY(-50px);
    }
}

#goldenNugget{
    position:fixed;
    display:none;
    font-size:60px;
    cursor:pointer;
    z-index:999;
}

.bat{
    position:fixed;
    font-size:40px;
    pointer-events:none;
    animation:fly 15s linear infinite;
}

@keyframes fly{
    from{
        left:-100px;
    }

    to{
        left:110%;
    }
}

#empire{
    font-size:32px;
    min-height:60px;
    line-height:2;
}

</style>
</head>
<body>

<div class="bat" style="top:50px;">🦇</div>
<div class="bat" style="top:200px;animation-delay:3s;">🦇</div>
<div class="bat" style="top:350px;animation-delay:7s;">🦇</div>

<div class="container">

<h1>🎃 Gold Empire Clicker 👻</h1>

<div style="font-size:35px;">
🎃 👻 🕷️ 🦇 🎃 👻 🕷️ 🦇 🎃
</div>

<div class="panel">

<h2>
Gold:
<span id="gold">0</span>
</h2>

<h3>
GPS:
<span id="gps">0</span>
</h3>

<button class="mine" onclick="mine(event)">
🎃
</button>

</div>

<div class="stats">

<div class="panel card">
<h3>Click Power</h3>
<span id="clickPower">1</span>
</div>

<div class="panel card">
<h3>Prestige</h3>
<span id="prestigeLevel">0</span>
</div>

<div class="panel card">
<h3>Total Gold</h3>
<span id="totalGold">0</span>
</div>

</div>

<div class="panel">

<h2>🏪 Shop</h2>

<button class="shopBtn" onclick="buyMiner()">
⛏️ Miner (+1 GPS)
<br>
Cost:
<span id="minerCost">15</span>
</button>

<br>

<button class="shopBtn" onclick="buyFactory()">
🏭 Factory (+10 GPS)
<br>
Cost:
<span id="factoryCost">100</span>
</button>

<br>

<button class="shopBtn" onclick="upgradePickaxe()">
🔨 Upgrade Pickaxe
<br>
Cost:
<span id="upgradeCost">25</span>
</button>

</div>

<div class="panel">

<h2>🏰 Empire</h2>

<div id="empire"></div>

</div>

<div class="panel">

<h2>🏆 Achievements</h2>

<div id="achievements"></div>

</div>

<div class="panel">

<h2>⭐ Prestige</h2>

<button class="rebirth" onclick="rebirth()">
Rebirth at 100,000 Gold
</button>

<p>+25% Bonus Per Prestige</p>

</div>

</div>

<div id="goldenNugget">🎃</div>

<script>

let gold = Number(localStorage.gold)||0;
let totalGold = Number(localStorage.totalGold)||0;
let clickPower = Number(localStorage.clickPower)||1;
let prestige = Number(localStorage.prestige)||0;

let miners = Number(localStorage.miners)||0;
let factories = Number(localStorage.factories)||0;

let minerCost = Number(localStorage.minerCost)||15;
let factoryCost = Number(localStorage.factoryCost)||100;
let upgradeCost = Number(localStorage.upgradeCost)||25;

let unlocked = JSON.parse(localStorage.unlocked || "[]");

function bonus(){
    return 1 + prestige * 0.25;
}

function getGPS(){
    return (miners + factories * 10) * bonus();
}

function save(){

    localStorage.gold = gold;
    localStorage.totalGold = totalGold;
    localStorage.clickPower = clickPower;
    localStorage.prestige = prestige;

    localStorage.miners = miners;
    localStorage.factories = factories;

    localStorage.minerCost = minerCost;
    localStorage.factoryCost = factoryCost;
    localStorage.upgradeCost = upgradeCost;

    localStorage.unlocked =
    JSON.stringify(unlocked);
}

function updateEmpire(){

    let empire =
    document.getElementById("empire");

    empire.innerHTML = "";

    for(let i=0;i<miners;i++){
        empire.innerHTML += "⛏️ ";
    }

    for(let i=0;i<factories;i++){
        empire.innerHTML += "🏭 ";
    }
}

function update(){

    document.getElementById("gold").innerText =
    Math.floor(gold);

    document.getElementById("gps").innerText =
    getGPS().toFixed(1);

    document.getElementById("clickPower").innerText =
    clickPower;

    document.getElementById("prestigeLevel").innerText =
    prestige;

    document.getElementById("totalGold").innerText =
    Math.floor(totalGold);

    document.getElementById("minerCost").innerText =
    minerCost;

    document.getElementById("factoryCost").innerText =
    factoryCost;

    document.getElementById("upgradeCost").innerText =
    upgradeCost;

    updateEmpire();

    checkAchievements();

    save();
}

function showFloating(text,x,y){

    let div = document.createElement("div");

    div.className = "floatText";

    div.innerText = text;

    div.style.left = x + "px";
    div.style.top = y + "px";

    document.body.appendChild(div);

    setTimeout(()=>{
        div.remove();
    },1000);
}

function mine(e){

    let gain =
    clickPower * bonus();

    if(Math.random() < 0.10){

        gain *= 10;

        showFloating(
        "CRIT x10!",
        e.pageX,
        e.pageY
        );
    }

    gold += gain;
    totalGold += gain;

    showFloating(
    "+" + Math.floor(gain),
    e.pageX,
    e.pageY
    );

    update();
}

function buyMiner(){

    if(gold >= minerCost){

        gold -= minerCost;

        miners++;

        minerCost =
        Math.floor(minerCost * 1.15);

        update();
    }
}

function buyFactory(){

    if(gold >= factoryCost){

        gold -= factoryCost;

        factories++;

        factoryCost =
        Math.floor(factoryCost * 1.18);

        update();
    }
}

function upgradePickaxe(){

    if(gold >= upgradeCost){

        gold -= upgradeCost;

        clickPower++;

        upgradeCost =
        Math.floor(upgradeCost * 2);

        update();
    }
}

function rebirth(){

    if(totalGold >= 100000){

        prestige++;

        gold = 0;
        miners = 0;
        factories = 0;
        clickPower = 1;

        minerCost = 15;
        factoryCost = 100;
        upgradeCost = 25;

        alert(
        "🎃 Prestige " +
        prestige +
        " Unlocked!"
        );

        update();
    }
}

const achievements = [

["First Gold",1],
["100 Gold",100],
["1,000 Gold",1000],
["10,000 Gold",10000],
["100,000 Gold",100000]

];

function checkAchievements(){

    let box =
    document.getElementById("achievements");

    box.innerHTML = "";

    achievements.forEach(a=>{

        if(totalGold >= a[1]){

            let div =
            document.createElement("div");

            div.className =
