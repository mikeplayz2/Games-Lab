<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>👻 Ghost Hunter</title>

<style>

body{
    margin:0;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:
    radial-gradient(circle,#1a1a2e,#0f0f1a);

    color:white;
    text-align:center;
}

h1{
    margin-top:20px;
    color:#8efcff;
}

#scoreboard{
    position:fixed;
    top:15px;
    left:15px;
    font-size:24px;
    background:rgba(0,0,0,.4);
    padding:10px 15px;
    border-radius:10px;
}

#lives{
    position:fixed;
    top:15px;
    right:15px;
    font-size:24px;
    background:rgba(0,0,0,.4);
    padding:10px 15px;
    border-radius:10px;
}

.enemy{
    position:absolute;
    cursor:pointer;
    user-select:none;
    animation:float 0.8s infinite alternate;
}

@keyframes float{
    from{
        transform:translateY(-5px);
    }
    to{
        transform:translateY(5px);
    }
}

#gameOver{

    position:fixed;
    inset:0;

    background:rgba(0,0,0,.9);

    display:none;

    align-items:center;

    justify-content:center;

    flex-direction:column;

    color:white;
}

button{
    padding:12px 20px;
    font-size:18px;
    border:none;
    border-radius:10px;
    cursor:pointer;
}

</style>

</head>

<body>

<h1>👻 Ghost Hunter</h1>

<div id="scoreboard">
Score: <span id="score">0</span>
</div>

<div id="lives">
Lives: <span id="lifeCount">5</span>
</div>

<div id="gameOver">

<h1>☠️ Game Over</h1>

<h2>
Final Score:
<span id="finalScore"></span>
</h2>

<button onclick="location.reload()">
Play Again
</button>

</div>

<script>

let score = 0;
let lives = 5;

function updateDisplay(){

    document.getElementById("score")
    .textContent = score;

    document.getElementById("lifeCount")
    .textContent = lives;

}

function loseLife(){

    lives--;

    updateDisplay();

    if(lives <= 0){

        document.getElementById(
        "finalScore"
        ).textContent = score;

        document.getElementById(
        "gameOver"
        ).style.display = "flex";

    }

}

function spawnEnemy(){

    const enemy =
    document.createElement("div");

    let types = [

        {
            emoji:"👻",
            points:1,
            size:60
        },

        {
            emoji:"💀",
            points:5,
            size:65
        },

        {
            emoji:"🎃",
            points:15,
            size:70
        },

        {
            emoji:"☠️",
            points:50,
            size:80
        }

    ];

    let chosen =
    types[
        Math.floor(
            Math.random()
            * types.length
        )
    ];

    enemy.innerHTML =
    chosen.emoji;

    enemy.className =
    "enemy";

    enemy.style.fontSize =
    chosen.size + "px";

    enemy.style.left =
    Math.random()
    * (window.innerWidth-100)
    + "px";

    enemy.style.top =
    Math.random()
    * (window.innerHeight-150)
    + "px";

    enemy.onclick = () => {

        score += chosen.points;

        updateDisplay();

        enemy.remove();

    };

    document.body
    .appendChild(enemy);

    setTimeout(()=>{

        if(enemy.parentNode){

            enemy.remove();

            loseLife();
        }

    },2500);

}

setInterval(()=>{

    if(lives > 0){

        spawnEnemy();

    }

},1000);

updateDisplay();

</script>

</body>
</html>
