<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🔫 Operation Overdrive</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div id="menu">

<h1>🔫 Operation Overdrive</h1>

<p>WASD = Move</p>
<p>Shift = Sprint</p>
<p>Left Click = Shoot</p>
<p>R = Reload</p>

<button id="startBtn">
Start Mission
</button>

</div>

<div id="crosshair">
+
</div>

<div id="damageOverlay"></div>

<div id="hud">

<p>☠️ Kills: <span id="kills">0</span></p>

<p>❤️ Health: <span id="health">100</span></p>

<p>🌊 Wave: <span id="wave">1</span></p>

<p>
🔫 Ammo:
<span id="ammo">30</span>
/
<span id="reserve">120</span>
</p>

<p>
🏆 High Score:
<span id="highscore">0</span>
</p>

</div>

<div id="deathScreen">

<h1>☠️ Mission Failed</h1>

<h2>
Kills:
<span id="finalKills">0</span>
</h2>

<button onclick="location.reload()">
Restart
</button>

</div>

<script type="module" src="js/main.js"></script>

</body>
</html>
