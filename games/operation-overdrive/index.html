<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🔫 Operation Overdrive</title>

<style>

body{
    margin:0;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:black;
}

canvas{
    display:block;
}

#menu{
    position:fixed;
    inset:0;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    background:#000;

    color:white;

    z-index:1000;
}

#menu h1{
    font-size:3rem;
}

button{

    border:none;

    padding:15px 25px;

    border-radius:12px;

    cursor:pointer;

    font-size:1rem;

    background:
    linear-gradient(
        135deg,
        #3b82f6,
        #9333ea
    );

    color:white;
}

#crosshair{

    position:fixed;

    left:50%;
    top:50%;

    transform:
    translate(-50%,-50%);

    font-size:32px;

    color:white;

    pointer-events:none;

    z-index:500;
}

#hud{

    position:fixed;

    top:20px;
    left:20px;

    color:white;

    background:
    rgba(0,0,0,.45);

    padding:15px;

    border-radius:15px;

    z-index:500;
}

#hud p{

    margin:5px 0;

}

#deathScreen{

    position:fixed;

    inset:0;

    background:
    rgba(0,0,0,.95);

    color:white;

    display:none;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    z-index:5000;
}

#deathScreen h1{

    font-size:4rem;

}

#deathScreen button{

    margin-top:20px;

}

</style>
</head>
<body>

<div id="menu">

<h1>🔫 Operation Overdrive</h1>

<p>WASD = Move</p>
<p>Mouse = Look</p>
<p>Left Click = Shoot</p>

<br>

<button id="startBtn">
Start Mission
</button>

</div>

<div id="crosshair">+</div>

<div id="hud">

<p>☠️ Kills:
<span id="kills">0</span></p>

<p>❤️ Health:
<span id="health">100</span></p>

<p>🏆 High Score:
<span id="highscore">0</span></p>

</div>

<div id="deathScreen">

<h1>☠️ Mission Failed</h1>

<h2>
Kills:
<span id="finalKills">0</span>
</h2>

<button onclick="location.reload()">
Restart
</button>

</div>

<script type="module">

import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js";

let kills = 0;
let health = 100;

let highScore =

localStorage.getItem(
"operationHighScore"
) || 0;

document.getElementById(
"highscore"
).textContent = highScore;

/* Scene */

const scene =
new THREE.Scene();

scene.background =
new THREE.Color(
0x87ceeb
);

/* Camera */

const camera =
new THREE.PerspectiveCamera(

75,

window.innerWidth /
window.innerHeight,

0.1,

1000

);

/* Renderer */

const renderer =
new THREE.WebGLRenderer({
antialias:true
});

renderer.setSize(
window.innerWidth,
window.innerHeight
);

document.body.appendChild(
renderer.domElement
);

/* Lighting */

scene.add(
new THREE.AmbientLight(
0xffffff,
0.7
)
);

const sun =
new THREE.DirectionalLight(
0xffffff,
1
);

sun.position.set(
10,
20,
10
);

scene.add(sun);

/* World */

const floor =
new THREE.Mesh(

new THREE.PlaneGeometry(
300,
300
),

new THREE.MeshStandardMaterial({

color:0x3b7d3b

})

);

floor.rotation.x =
-Math.PI/2;

scene.add(floor);

/* Obstacles */

for(let i=0;i<25;i++){

const wall =
new THREE.Mesh(

new THREE.BoxGeometry(
5,
5,
5
),

new THREE.MeshStandardMaterial({

color:0x666666

})

);

wall.position.set(

(Math.random()-0.5)*120,

2.5,

(Math.random()-0.5)*120

);

scene.add(wall);

}

/* Player */

camera.position.set(
0,
2,
10
);

/* Gun */

const gun =
new THREE.Mesh(

new THREE.BoxGeometry(
0.3,
0.2,
1
),

new THREE.MeshStandardMaterial({

color:0x202020

})

);

camera.add(gun);

gun.position.set(
0.4,
-0.3,
-0.8
);

scene.add(camera);

/* Controls */

let yaw = 0;
let pitch = 0;

const keys = {};

document.addEventListener(
"keydown",
e=>{
keys[e.key.toLowerCase()] = true;
}
);

document.addEventListener(
"keyup",
e=>{
keys[e.key.toLowerCase()] = false;
}
);

document.addEventListener(
"mousemove",

e=>{

if(
document.pointerLockElement
=== renderer.domElement
){

yaw -=
e.movementX * 0.002;

pitch -=
e.movementY * 0.002;

pitch = Math.max(
-1.4,
Math.min(
1.4,
pitch
)
);

}

}
);

/* Shooting */

const bullets = [];

function shoot(){

const direction =
new THREE.Vector3();

camera.getWorldDirection(
direction
);

bullets.push({

position:
camera.position.clone(),

velocity:
direction.multiplyScalar(
1.2
)

});

}

document.addEventListener(
"mousedown",
()=>{

if(
document.pointerLockElement
=== renderer.domElement
){

shoot();

}

}
);

/* Enemies */

const enemies = [];

function spawnEnemy(){

const enemy =
new THREE.Mesh(

new THREE.BoxGeometry(
2,
2,
2
),

new THREE.MeshStandardMaterial({

color:0xff0000

})

);

enemy.position.set(

(Math.random()-0.5)*100,

1,

(Math.random()-0.5)*100

);

scene.add(enemy);

enemies.push(enemy);

}

for(let i=0;i<12;i++){

spawnEnemy();

}

/* Start Button */

document.getElementById(
"startBtn"
).onclick = ()=>{

document.getElementById(
"menu"
).style.display =
"none";

renderer.domElement
.requestPointerLock();

};

/* Game Loop */

function animate(){

requestAnimationFrame(
animate
);

/* Movement */

const speed = 0.15;

if(keys["w"]){

camera.position.x -=
Math.sin(yaw)*speed;

camera.position.z -=
Math.cos(yaw)*speed;

}

if(keys["s"]){

camera.position.x +=
Math.sin(yaw)*speed;

camera.position.z +=
Math.cos(yaw)*speed;

}

if(keys["a"]){

camera.position.x -=
Math.cos(yaw)*speed;

camera.position.z +=
Math.sin(yaw)*speed;

}

if(keys["d"]){

camera.position.x +=
Math.cos(yaw)*speed;

camera.position.z -=
Math.sin(yaw)*speed;

}

camera.rotation.order =
"YXZ";

camera.rotation.y =
yaw;

camera.rotation.x =
pitch;

/* Enemy AI */

for(let i=enemies.length-1;i>=0;i--){

const enemy =
enemies[i];

const direction =
new THREE.Vector3()

.subVectors(
camera.position,
enemy.position
)

.normalize();

enemy.position.add(

direction.multiplyScalar(
0.03
)

);

const distance =
enemy.position.distanceTo(
camera.position
);

if(distance < 1.5){

health -= 0.20;

document.getElementById(
"health"
).textContent =
Math.floor(
health
);

}

}

/* Bullets */

for(
let i=bullets.length-1;
i>=0;
i--
){

const bullet =
bullets[i];

if(!bullet.mesh){

bullet.mesh =
new THREE.Mesh(

new THREE.SphereGeometry(
0.1,
8,
8
),

new THREE.MeshBasicMaterial({

color:0xffff00

})

);

scene.add(
bullet.mesh
);

}

bullet.position.add(
bullet.velocity
);

bullet.mesh.position.copy(
bullet.position
);

for(
let e=enemies.length-1;
e>=0;
e--
){

const enemy =
enemies[e];

if(

bullet.position.distanceTo(
enemy.position
) < 1.5

){

scene.remove(enemy);

enemies.splice(
e,
1
);

scene.remove(
bullet.mesh
);

bullets.splice(
i,
1
);

kills++;

document.getElementById(
"kills"
).textContent =
kills;

if(kills > highScore){

highScore = kills;

localStorage.setItem(
"operationHighScore",
highScore
);

document.getElementById(
"highscore"
).textContent =
highScore;

}

spawnEnemy();

break;

}

}

}

/* Death */

if(health <= 0){

document.getElementById(
"finalKills"
).textContent =
kills;

document.getElementById(
"deathScreen"
).style.display =
"flex";

return;
}

renderer.render(
scene,
camera
);

}

animate();

/* Resize */

window.addEventListener(
"resize",
()=>{

camera.aspect =
window.innerWidth /
window.innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
window.innerWidth,
window.innerHeight
);

}
);

</script>

</body>
</html>
