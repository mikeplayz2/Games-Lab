<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🔫 Operation Overdrive</title>

<style>

body{
    margin:0;
    overflow:hidden;
    font-family:Arial,sans-serif;
}

#menu{

    position:fixed;

    inset:0;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    background:#000;

    color:white;

    z-index:999;
}

button{

    padding:15px 20px;

    border:none;

    border-radius:12px;

    cursor:pointer;

}

#crosshair{

    position:fixed;

    top:50%;

    left:50%;

    transform:
    translate(-50%,-50%);

    color:white;

    font-size:28px;

    pointer-events:none;

}

</style>

</head>
<body>

<div id="menu">

<h1>🔫 Operation Overdrive</h1>

<p>WASD to move | Mouse to look</p>

<button id="startBtn">

Start Game

</button>

</div>

<div id="crosshair">
+
</div>

<script type="module">

import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js';

let scene =
new THREE.Scene();

scene.background =
new THREE.Color(
0x87ceeb
);

let camera =
new THREE.PerspectiveCamera(

75,

window.innerWidth /
window.innerHeight,

0.1,

1000

);

let renderer =
new THREE.WebGLRenderer();

renderer.setSize(
window.innerWidth,
window.innerHeight
);

document.body.appendChild(
renderer.domElement
);

const light =
new THREE.DirectionalLight(
0xffffff,
1
);

light.position.set(
5,
10,
5
);

scene.add(light);

scene.add(
new THREE.AmbientLight(
0xffffff,
0.5
)
);

const floor =
new THREE.Mesh(

new THREE.PlaneGeometry(
200,
200
),

new THREE.MeshStandardMaterial({

color:0x3b7d3b

})

);

floor.rotation.x =
-Math.PI/2;

scene.add(floor);

for(let i=0;i<20;i++){

    const wall =
    new THREE.Mesh(

    new THREE.BoxGeometry(
    5,5,5
    ),

    new THREE.MeshStandardMaterial({

    color:0x666666

    })

    );

    wall.position.set(

        (Math.random()-0.5)*100,

        2.5,

        (Math.random()-0.5)*100

    );

    scene.add(wall);

}

camera.position.y = 2;

const keys = {};

document.addEventListener(
'keydown',
e=>keys[e.key.toLowerCase()]
=true
);

document.addEventListener(
'keyup',
e=>keys[e.key.toLowerCase()]
=false
);

let yaw = 0;
let pitch = 0;

document.addEventListener(
'mousemove',

e=>{

if(
document.pointerLockElement
=== renderer.domElement
){

yaw -=
e.movementX * 0.002;

pitch -=
e.movementY * 0.002;

pitch =
Math.max(
-1.5,
Math.min(
1.5,
pitch
)
);

}

}
);

document.getElementById(
"startBtn"
).onclick = ()=>{

document.getElementById(
"menu"
).style.display =
"none";

renderer.domElement
.requestPointerLock();

};

function animate(){

requestAnimationFrame(
animate
);

let speed = 0.15;

if(keys["w"]){

camera.position.x -=
Math.sin(yaw)*speed;

camera.position.z -=
Math.cos(yaw)*speed;

}

if(keys["s"]){

camera.position.x +=
Math.sin(yaw)*speed;

camera.position.z +=
Math.cos(yaw)*speed;

}

if(keys["a"]){

camera.position.x -=
Math.cos(yaw)*speed;

camera.position.z +=
Math.sin(yaw)*speed;

}

if(keys["d"]){

camera.position.x +=
Math.cos(yaw)*speed;

camera.position.z -=
Math.sin(yaw)*speed;

}

camera.rotation.order =
"YXZ";

camera.rotation.y =
yaw;

camera.rotation.x =
pitch;

renderer.render(
scene,
camera
);

}

animate();

window.addEventListener(
'resize',
()=>{

camera.aspect =
window.innerWidth /
window.innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
window.innerWidth,
window.innerHeight
);

}
);

</script>

</body>
</html>
