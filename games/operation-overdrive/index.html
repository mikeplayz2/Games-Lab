<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🔫 Operation Overdrive</title>

<style>

body{
    margin:0;
    overflow:hidden;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
}

#menu{
    position:fixed;
    inset:0;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    background:black;
    color:white;

    z-index:1000;
}

#crosshair{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);

    color:white;
    font-size:32px;

    pointer-events:none;

    z-index:500;
}

#hud{
    position:fixed;
    top:20px;
    left:20px;

    color:white;

    background:rgba(0,0,0,.4);

    padding:15px;

    border-radius:15px;

    z-index:500;
}

button{
    padding:15px 25px;
    border:none;
    border-radius:12px;
    cursor:pointer;
}

</style>

</head>
<body>

<div id="menu">

<h1>🔫 Operation Overdrive</h1>

<p>WASD to Move</p>
<p>Mouse to Look</p>
<p>Left Click to Shoot</p>

<button id="startBtn">
Start Game
</button>

</div>

<div id="crosshair">+</div>

<div id="hud">

Kills:
<span id="kills">
0
</span>

</div>

<script type="module">

import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js";

let kills = 0;

const scene = new THREE.Scene();

scene.background =
new THREE.Color(0x87ceeb);

const camera =
new THREE.PerspectiveCamera(
75,
window.innerWidth/window.innerHeight,
0.1,
1000
);

const renderer =
new THREE.WebGLRenderer();

renderer.setSize(
window.innerWidth,
window.innerHeight
);

document.body.appendChild(
renderer.domElement
);

/* LIGHTS */

const ambient =
new THREE.AmbientLight(
0xffffff,
0.7
);

scene.add(ambient);

const sun =
new THREE.DirectionalLight(
0xffffff,
1
);

sun.position.set(
10,
20,
10
);

scene.add(sun);

/* FLOOR */

const floor =
new THREE.Mesh(

new THREE.PlaneGeometry(
300,
300
),

new THREE.MeshStandardMaterial({

color:0x3b7d3b

})

);

floor.rotation.x =
-Math.PI/2;

scene.add(floor);

/* WALLS */

for(let i=0;i<20;i++){

    const wall =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            5,
            5,
            5
        ),

        new THREE.MeshStandardMaterial({

            color:0x666666

        })

    );

    wall.position.set(

        (Math.random()-0.5)*120,

        2.5,

        (Math.random()-0.5)*120

    );

    scene.add(wall);

}

/* PLAYER */

camera.position.set(
0,
2,
10
);

const keys = {};

document.addEventListener(
"keydown",
e=>{

keys[e.key.toLowerCase()] = true;

}
);

document.addEventListener(
"keyup",
e=>{

keys[e.key.toLowerCase()] = false;

}
);

let yaw = 0;
let pitch = 0;

document.addEventListener(
"mousemove",

e=>{

if(
document.pointerLockElement
=== renderer.domElement
){

yaw -=
e.movementX * 0.002;

pitch -=
e.movementY * 0.002;

pitch =
Math.max(
-1.4,
Math.min(
1.4,
pitch
)
);

}

}
);

/* BULLETS */

const bullets = [];

function shoot(){

const direction =
new THREE.Vector3();

camera.getWorldDirection(
direction
);

bullets.push({

position:
camera.position.clone(),

velocity:
direction.multiplyScalar(
1.2
)

});

}

document.addEventListener(
"mousedown",
()=>{

if(
document.pointerLockElement
=== renderer.domElement
){

shoot();

}

}
);

/* ENEMIES */

const enemies = [];

function spawnEnemy(){

const enemy =
new THREE.Mesh(

new THREE.BoxGeometry(
2,
2,
2
),

new THREE.MeshStandardMaterial({

color:0xff0000

})

);

enemy.position.set(

(Math.random()-0.5)*100,

1,

(Math.random()-0.5)*100

);

scene.add(enemy);

enemies.push(enemy);

}

for(let i=0;i<10;i++){

spawnEnemy();

}

/* START */

document.getElementById(
"startBtn"
).onclick = ()=>{

document.getElementById(
"menu"
).style.display =
"none";

renderer.domElement
.requestPointerLock();

};

/* LOOP */

function animate(){

requestAnimationFrame(
animate
);

/* MOVEMENT */

const speed = 0.15;

if(keys["w"]){

camera.position.x -=
Math.sin(yaw)*speed;

camera.position.z -=
Math.cos(yaw)*speed;

}

if(keys["s"]){

camera.position.x +=
Math.sin(yaw)*speed;

camera.position.z +=
Math.cos(yaw)*speed;

}

if(keys["a"]){

camera.position.x -=
Math.cos(yaw)*speed;

camera.position.z +=
Math.sin(yaw)*speed;

}

if(keys["d"]){

camera.position.x +=
Math.cos(yaw)*speed;

camera.position.z -=
Math.sin(yaw)*speed;

}

camera.rotation.order =
"YXZ";

camera.rotation.y =
yaw;

camera.rotation.x =
pitch;

/* BULLETS */

for(
let i=bullets.length-1;
i>=0;
i--
){

const bullet =
bullets[i];

if(!bullet.mesh){

bullet.mesh =
new THREE.Mesh(

new THREE.SphereGeometry(
0.1,
8,
8
),

new THREE.MeshBasicMaterial({

color:0xffff00

})

);

scene.add(
bullet.mesh
);

}

bullet.position.add(
bullet.velocity
);

bullet.mesh.position.copy(
bullet.position
);

/* HIT DETECTION */

for(
let e=enemies.length-1;
e>=0;
e--
){

const enemy =
enemies[e];

if(

bullet.position.distanceTo(
enemy.position
) < 1.5

){

scene.remove(enemy);

enemies.splice(
e,
1
);

scene.remove(
bullet.mesh
);

bullets.splice(
i,
1
);

kills++;

document.getElementById(
"kills"
).textContent =
kills;

spawnEnemy();

break;

}

}

}

/* RENDER */

renderer.render(
scene,
camera
);

}

animate();

/* RESIZE */

window.addEventListener(
"resize",
()=>{

camera.aspect =
window.innerWidth /
window.innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
window.innerWidth,
window.innerHeight);

}
);

</script>

</body>
</html>
