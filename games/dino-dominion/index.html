<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>🦖 Dino Dominion</title>

<link rel="stylesheet"
href="style.css">

</head>
<body>

<div id="startScreen">

<h1>🦖 Dino Dominion</h1>

<p>
Survive the prehistoric world.
Collect food, fossils and evolve into
the ultimate predator.
</p>

<button onclick="startGame()">
▶ Start Adventure
</button>

</div>

<div id="hud">

<h2>🦖 Dino Dominion</h2>

<p>⭐ XP: <span id="xp">0</span></p>

<p>🥩 Food: <span id="food">0</span></p>

<p>🦴 Fossils: <span id="fossils">0</span></p>

<p>📅 Days: <span id="days">1</span></p>

</div>

<div id="evolution">

<h3>Evolution</h3>

<p id="stage">
🥚 Hatchling
</p>

</div>

<button id="pauseButton">
⏸ Pause
</button>

<div id="gameOver">

<h1>☄️ Extinction!</h1>

<h2>
Survived:
<span id="finalDays">0</span>
Days
</h2>

<button onclick="location.reload()">
🔄 Play Again
</button>

</div>

<canvas id="game"></canvas>

<div id="controls">

<button id="upBtn">⬆</button>

<div class="middle">

<button id="leftBtn">⬅</button>

<button id="downBtn">⬇</button>

<button id="rightBtn">➡</button>

</div>

</div>

<script>

const canvas =
document.getElementById("game");

const ctx =
canvas.getContext("2d");

function resize(){

canvas.width =
window.innerWidth;

canvas.height =
window.innerHeight;

}

resize();

window.addEventListener(
"resize",
resize
);

let gameStarted = false;
let paused = false;

let xp = 0;
let food = 0;
let fossils = 0;
let days = 1;

const player = {

x:500,
y:350,

size:50,
speed:5

};

const foods = [];
const fossilItems = [];
const meteors = [];

const keys = {};

const touch = {

up:false,
down:false,
left:false,
right:false

};

document.addEventListener(
"keydown",
e => keys[e.key] = true
);

document.addEventListener(
"keyup",
e => keys[e.key] = false
);

function setupMobile(id,key){

const btn =
document.getElementById(id);

btn.addEventListener(
"touchstart",
()=>{
touch[key]=true;
}
);

btn.addEventListener(
"touchend",
()=>{
touch[key]=false;
}
);

}

setupMobile(
"upBtn",
"up"
);

setupMobile(
"downBtn",
"down"
);

setupMobile(
"leftBtn",
"left"
);

setupMobile(
"rightBtn",
"right"
);

function startGame(){

gameStarted = true;

document.getElementById(
"startScreen"
).style.display =
"none";

}

document.getElementById(
"pauseButton"
).onclick = () => {

paused = !paused;

document.getElementById(
"pauseButton"
).textContent =
paused
? "▶ Resume"
: "⏸ Pause";

};

function evolve(){

const stage =
document.getElementById(
"stage"
);

if(xp >= 200){

player.size = 100;

stage.textContent =
"👑 Apex Predator";

}else if(xp >= 150){

player.size = 85;

stage.textContent =
"🦕 Dominator";

}else if(xp >= 100){

player.size = 70;

stage.textContent =
"🦖 Raptor";

}else if(xp >= 50){

player.size = 60;

stage.textContent =
"🦎 Juvenile";

}else{

player.size = 50;

stage.textContent =
"🥚 Hatchling";

}

}

function spawnFood(){

foods.push({

x:
Math.random()
* canvas.width,

y:
Math.random()
* canvas.height

});

}

function spawnFossil(){

fossilItems.push({

x:
Math.random()
* canvas.width,

y:
Math.random()
* canvas.height

});

}

function spawnMeteor(){

meteors.push({

x:
Math.random()
* canvas.width,

y:-50,

speed:
3 +
Math.random()*4

});

}

function update(){

if(!gameStarted) return;

if(paused) return;

if(
keys["ArrowLeft"] ||
keys["a"] ||
touch.left
){

player.x -=
player.speed;

}

if(
keys["ArrowRight"] ||
keys["d"] ||
touch.right
){

player.x +=
player.speed;

}

if(
keys["ArrowUp"] ||
keys["w"] ||
touch.up
){

player.y -=
player.speed;

}

if(
keys["ArrowDown"] ||
keys["s"] ||
touch.down
){

player.y +=
player.speed;

}

player.x =
Math.max(
20,
Math.min(
canvas.width-20,
player.x
)
);

player.y =
Math.max(
100,
Math.min(
canvas.height-20,
player.y
)
);

for(let i=
foods.length-1;
i>=0;
i--){

const f =
foods[i];

const d =
Math.hypot(
player.x-f.x,
player.y-f.y
);

if(d < 40){

foods.splice(i,1);

food++;

xp += 5;

evolve();

}

}

for(let i=
fossilItems.length-1;
i>=0;
i--){

const f =
fossilItems[i];

const d =
Math.hypot(
player.x-f.x,
player.y-f.y
);

if(d < 40){

fossilItems.splice(i,1);

fossils++;

xp += 20;

evolve();

}

}

for(let i=
meteors.length-1;
i>=0;
i--){

const m =
meteors[i];

m.y += m.speed;

if(m.y >
canvas.height){

meteors.splice(i,1);

continue;

}

const d =
Math.hypot(
player.x-m.x,
player.y-m.y
);

if(d < 45){

gameOver();

}

}

document.getElementById(
"xp"
).textContent = xp;

document.getElementById(
"food"
).textContent =
food;

document.getElementById(
"fossils"
).textContent =
fossils;

document.getElementById(
"days"
).textContent =
days;

}

function draw(){

ctx.clearRect(
0,0,
canvas.width,
canvas.height
);

for(let x=0;
x<canvas.width;
x+=150){

ctx.font =
"50px Arial";

ctx.fillText(
"🌴",
x,
canvas.height-50
);

}

ctx.font =
"30px Arial";

foods.forEach(
f =>
ctx.fillText(
"🥩",
f.x,
f.y
)
);

fossilItems.forEach(
f =>
ctx.fillText(
"🦴",
f.x,
f.y
)
);

meteors.forEach(
m =>
ctx.fillText(
"☄️",
m.x,
m.y
)
);

ctx.font =
player.size + "px Arial";

ctx.fillText(
"🦖",
player.x,
player.y
);

}

function loop(){

update();

draw();

requestAnimationFrame(
loop
);

}

function gameOver(){

document.getElementById(
"finalDays"
).textContent =
days;

document.getElementById(
"gameOver"
).style.display =
"flex";

paused = true;

}

setInterval(
spawnFood,
1500
);

setInterval(
spawnFossil,
5000
);

setInterval(
spawnMeteor,
2000
);

setInterval(
()=>{

if(gameStarted &&
!paused){

days++;

}

},
10000
);

loop();

</script>

</body>
</html>
