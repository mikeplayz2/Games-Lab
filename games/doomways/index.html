<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🚪 DOOMWAYS</title>

<style>

body{
    margin:0;
    background:
    linear-gradient(
    180deg,
    #000000,
    #111111,
    #1a1a1a
    );

    color:white;
    font-family:Arial,sans-serif;
    text-align:center;

    min-height:100vh;
}

h1{
    color:#ff0000;
    text-shadow:0 0 20px red;
}

.panel{

    max-width:900px;

    margin:20px auto;

    padding:20px;

    border-radius:20px;

    background:
    rgba(255,255,255,.06);

    border:1px solid
    rgba(255,255,255,.1);
}

.room{
    font-size:100px;
    margin:20px;
}

button{

    padding:15px 25px;

    border:none;

    border-radius:12px;

    background:#aa0000;

    color:white;

    cursor:pointer;

    margin:10px;
}

button:hover{
    transform:scale(1.05);
}

.stats{

    display:flex;

    justify-content:center;

    flex-wrap:wrap;

    gap:20px;
}

.card{

    min-width:150px;

    padding:15px;

    background:
    rgba(255,255,255,.05);

    border-radius:15px;
}

#gameOver{

    display:none;

    position:fixed;

    inset:0;

    background:rgba(0,0,0,.95);

    align-items:center;

    justify-content:center;

    flex-direction:column;

    z-index:999;
}

</style>

</head>

<body>

<h1>🚪 DOOMWAYS</h1>

<div class="stats">

<div class="card">
<h3>Door</h3>
<span id="doorNumber">1</span>
</div>

<div class="card">
<h3>Coins</h3>
<span id="coins">0</span>
</div>

<div class="card">
<h3>Health</h3>
<span id="health">100</span>
</div>

</div>

<div class="panel">

<div class="room" id="roomIcon">
🚪
</div>

<h2 id="roomName">
Starting Room
</h2>

<p id="roomDescription">
Open doors and survive.
</p>

<button onclick="openDoor()">
🚪 Open Door
</button>

</div>

<div class="panel">

<h2>🎒 Inventory</h2>

<div id="inventory">
Nothing Yet
</div>

</div>

<div class="panel">

<h2>📜 Event Log</h2>

<div id="log">
Welcome to DOOMWAYS...
</div>

</div>

<div id="gameOver">

<h1>☠️ YOU DIED</h1>

<h2>
You reached Door
<span id="finalDoor"></span>
</h2>

<button onclick="location.reload()">
Try Again
</button>

</div>

<script>

let door = 1;
let coins = 0;
let health = 100;

let inventory = [];

const rooms = [

{
emoji:"💰",
name:"Coin Room",
description:"You found loose coins.",
reward:"coins"
},

{
emoji:"📦",
name:"Supply Room",
description:"You found an item.",
reward:"item"
},

{
emoji:"🕯️",
name:"Dark Hallway",
description:"Nothing here.",
reward:"empty"
},

{
emoji:"👁️",
name:"Watcher Room",
description:"Something is watching...",
reward:"damage"
},

{
emoji:"💀",
name:"Shade Encounter",
description:"A shadow attacks.",
reward:"damage"
},

{
emoji:"🗝️",
name:"Key Room",
description:"A mysterious key.",
reward:"key"
}

];

function updateUI(){

document.getElementById(
"doorNumber"
).textContent = door;

document.getElementById(
"coins"
).textContent = coins;

document.getElementById(
"health"
).textContent = health;

if(inventory.length===0){

document.getElementById(
"inventory"
).textContent =
"Nothing Yet";

}else{

document.getElementById(
"inventory"
).innerHTML =
inventory.join("<br>");

}

}

function log(text){

document.getElementById(
"log"
).innerHTML =
text +
"<br><br>" +
document.getElementById(
"log"
).innerHTML;

}

function openDoor(){

door++;

let room =
rooms[
Math.floor(
Math.random() *
rooms.length
)
];

document.getElementById(
"roomIcon"
).textContent =
room.emoji;

document.getElementById(
"roomName"
).textContent =
room.name;

document.getElementById(
"roomDescription"
).textContent =
room.description;

if(room.reward==="coins"){

let reward =
Math.floor(
Math.random()*20
)+5;

coins += reward;

log(
"💰 Found "+reward+
" Coins"
);

}

if(room.reward==="item"){

const items = [

"🔦 Flashlight",
"🔋 Battery",
"🩹 Medkit",
"🗝️ Skeleton Key"

];

let item =
items[
Math.floor(
Math.random()*items.length
)
];

inventory.push(item);

log(
"📦 Found " +
item
);

}

if(room.reward==="damage"){

let damage =
Math.floor(
Math.random()*15
)+5;

health -= damage;

log(
"💀 Lost "+
damage+
" Health"
);

}

if(room.reward==="key"){

inventory.push(
"🗝️ Door Key"
);

log(
"🗝️ Found Key"
);

}

if(door % 10 === 0){

log(
"🚪 Reached Door "+
door
);

coins += 50;

}

checkDeath();

updateUI();

}

function checkDeath(){

if(health<=0){

document.getElementById(
"finalDoor"
).textContent =
door;

document.getElementById(
"gameOver"
).style.display =
"flex";

}

}

updateUI();

</script>

</body>
</html>
