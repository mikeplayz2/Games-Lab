<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🎃 Gold Empire Clicker</title>
<link rel="icon" href="logo.png">

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#120b08;
    color:white;
    text-align:center;
}

h1{
    color:#ff8c00;
    text-shadow:0 0 20px orange;
}

.panel{
    margin:15px auto;
    padding:15px;
    max-width:1000px;
    background:#24160f;
    border:2px solid #ff8c00;
    border-radius:12px;
}

button{
    margin:4px;
    padding:8px;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

.mine{
    width:180px;
    height:180px;
    border-radius:50%;
    font-size:60px;
    background:orange;
}

.shop{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
}

.shop button{
    width:180px;
    background:#ff8c00;
    color:white;
}

#empire{
    font-size:35px;
    min-height:60px;
}

.inventory-item{
    margin:4px;
}

.bat{
    position:fixed;
    font-size:32px;
    pointer-events:none;
    animation:fly 18s linear infinite;
}

@keyframes fly{
    from{left:-100px;}
    to{left:110%;}
}

#pumpkinEvent{
    display:none;
    position:fixed;
    font-size:60px;
    cursor:pointer;
}
</style>
</head>
<body>

<div class="bat" style="top:80px;">🦇</div>
<div class="bat" style="top:220px;animation-delay:5s;">🦇</div>

<h1>🎃 Gold Empire Clicker 👻</h1>

<div class="panel">
<h2>Gold: <span id="gold">0</span></h2>
<h3>Candy: <span id="candy">0</span></h3>
<h3>GPS: <span id="gps">0</span></h3>

<button class="mine" onclick="mine()">
🎃
</button>
</div>

<div class="panel">
<h2>🏰 Empire</h2>
<div id="empire"></div>
</div>

<div class="panel">
<h2>🏪 Halloween Shop</h2>

<div id="shop" class="shop"></div>

<button onclick="buyLootBag()">
🎁 Trick-or-Treat Bag (100 Gold)
</button>

</div>

<div class="panel">
<h2>🎒 Inventory</h2>
<div id="inventory"></div>
</div>

<div class="panel">
<h2>🏆 Achievements</h2>
<div id="achievements"></div>
</div>

<div id="pumpkinEvent">🎃</div>

<script>

let gold = Number(localStorage.gold)||0;
let candy = Number(localStorage.candy)||0;

let inventory =
JSON.parse(localStorage.inventory||"{}");

const buildings = [

{name:"🎃 Pumpkin Patch",cost:15,gps:1,count:0},
{name:"🕯️ Candle Maker",cost:50,gps:3,count:0},
{name:"🕷️ Spider Nest",cost:100,gps:6,count:0},
{name:"🦇 Bat Cave",cost:250,gps:12,count:0},
{name:"🍬 Candy Factory",cost:500,gps:25,count:0},
{name:"👻 Ghost House",cost:1000,gps:50,count:0},
{name:"🧙 Witch Hut",cost:2500,gps:100,count:0},
{name:"🐈‍⬛ Cat Sanctuary",cost:5000,gps:250,count:0},
{name:"⚰️ Crypt",cost:10000,gps:500,count:0},
{name:"🪦 Graveyard",cost:25000,gps:1000,count:0},
{name:"🏚️ Haunted Manor",cost:50000,gps:2500,count:0},
{name:"🎪 Haunted Carnival",cost:100000,gps:5000,count:0},
{name:"🏰 Haunted Castle",cost:250000,gps:10000,count:0},
{name:"💀 Reaper Temple",cost:500000,gps:25000,count:0},
{name:"🐉 Bone Dragon Lair",cost:1000000,gps:50000,count:0}

];

function save(){

localStorage.gold=gold;
localStorage.candy=candy;
localStorage.inventory=
JSON.stringify(inventory);

}

function getGPS(){

let gps=0;

for(let b of buildings){

gps += b.count*b.gps;

}

return gps;
}

function update(){

document.getElementById("gold").textContent=
Math.floor(gold);

document.getElementById("candy").textContent=
candy;

document.getElementById("gps").textContent=
getGPS();

drawInventory();
drawEmpire();
drawAchievements();

save();
}

function mine(){

gold++;

if(Math.random()<0.10){

addItem("🍬 Candy");

candy++;

}

update();

}

function drawShop(){

const shop=
document.getElementById("shop");

for(let i=0;i<buildings.length;i++){

let b=
document.createElement("button");

b.innerHTML=
`${buildings[i].name}<br>
Cost: ${buildings[i].cost}`;

b.onclick=()=>buyBuilding(i);

shop.appendChild(b);

}

}

function buyBuilding(i){

let b=buildings[i];

if(gold>=b.cost){

gold-=b.cost;

b.count++;

b.cost=
Math.floor(b.cost*1.15);

update();
drawShopRefresh();

}

}

function drawShopRefresh(){

document.getElementById("shop")
.innerHTML="";

drawShop();

}

function drawEmpire(){

let text="";

for(let b of buildings){

for(let i=0;i<b.count;i++){

text += b.name.split(" ")[0];

}

}

document.getElementById("empire")
.innerHTML=text;

}

function addItem(item){

if(!inventory[item]){

inventory[item]=0;

}

inventory[item]++;

}

function drawInventory(){

let html="";

for(let item in inventory){

html += `
<div class="inventory-item">
${item} x${inventory[item]}
<button onclick="sellItem('${item}')">
Sell
</button>
</div>
`;

}

document.getElementById("inventory")
.innerHTML=html;

}

function sellItem(item){

if(inventory[item] > 0){

inventory[item]--;

gold += 25;

if(inventory[item]===0){

delete inventory[item];

}

update();

}

}

function buyLootBag(){

if(gold<100)return;

gold-=100;

const items=[
"🍬 Candy",
"🕷️ Spider Silk",
"🦇 Bat Wing",
"👻 Ghost Essence",
"💀 Ancient Skull"
];

let reward=
items[Math.floor(Math.random()*items.length)];

addItem(reward);

alert("You found: " + reward);

update();

}

function drawAchievements(){

let html="";

if(gold>=100)
html+="✅ 100 Gold<br>";

if(gold>=1000)
html+="✅ 1,000 Gold<br>";

if(getGPS()>=100)
html+="✅ Growing Empire<br>";

if(Object.keys(inventory).length>=5)
html+="✅ Collector<br>";

document.getElementById("achievements")
.innerHTML=html;

}

function spawnPumpkin(){

const p=
document.getElementById("pumpkinEvent");

p.style.display="block";

p.style.left=
(Math.random()*80)+"vw";

p.style.top=
(Math.random()*80)+"vh";

p.onclick=()=>{

gold+=500;

addItem("🎃 Pumpkin");

alert("🎃 Jackpot!");

p.style.display="none";

update();

};

setTimeout(()=>{
p.style.display="none";
},10000);

}

setInterval(()=>{

gold += getGPS();

update();

},1000);

setInterval(()=>{

if(Math.random()<0.4){

spawnPumpkin();

}

},30000);

drawShop();
update();

</script>

</body>
</html>
