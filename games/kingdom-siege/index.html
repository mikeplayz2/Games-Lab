<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>👑 Kingdom Siege</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:Segoe UI,sans-serif;

    color:white;

    min-height:100vh;

    text-align:center;

    background:
    linear-gradient(
        180deg,
        #111827,
        #1e293b,
        #020617
    );

}

h1{

    padding-top:20px;

    margin-bottom:20px;

}

.stats{

    display:flex;

    justify-content:center;

    gap:20px;

    flex-wrap:wrap;

    margin:20px;
}

.card{

    background:
    rgba(255,255,255,.08);

    backdrop-filter:blur(20px);

    padding:15px 20px;

    border-radius:18px;

    min-width:150px;

}

.panel{

    width:95%;

    max-width:1000px;

    margin:20px auto;

    padding:20px;

    border-radius:25px;

    background:
    rgba(255,255,255,.08);

    backdrop-filter:blur(20px);

}

button{

    margin:8px;

    padding:12px 20px;

    border:none;

    border-radius:14px;

    cursor:pointer;

    color:white;

    background:
    linear-gradient(
        135deg,
        #2563eb,
        #7c3aed
    );

}

button:hover{

    transform:scale(1.05);

}

#log{

    text-align:left;

    max-height:250px;

    overflow:auto;

}

#gameOver{

    display:none;

    position:fixed;

    inset:0;

    background:rgba(0,0,0,.9);

    flex-direction:column;

    align-items:center;

    justify-content:center;

}

</style>

</head>

<body>

<h1>👑 Kingdom Siege</h1>

<div class="stats">

<div class="card">
🏰 Day<br>
<span id="day">1</span>
</div>

<div class="card">
💰 Gold<br>
<span id="gold">100</span>
</div>

<div class="card">
⚔️ Soldiers<br>
<span id="soldiers">5</span>
</div>

<div class="card">
❤️ Castle HP<br>
<span id="castle">100</span>
</div>

</div>

<div class="panel">

<h2>🏗 Kingdom Management</h2>

<button onclick="mineGold()">
⛏ Collect Gold
</button>

<button onclick="trainSoldier()">
⚔️ Train Soldier (50 Gold)
</button>

<button onclick="repairCastle()">
🛠 Repair Castle (30 Gold)
</button>

<button onclick="nextDay()">
🌙 End Day
</button>

</div>

<div class="panel">

<h2>📜 Kingdom Log</h2>

<div id="log">

Welcome to Kingdom Siege.

</div>

</div>

<div id="gameOver">

<h1>☠️ Kingdom Destroyed</h1>

<h2>
You Survived
<span id="finalDay"></span>
Days
</h2>

<button onclick="location.reload()">
Play Again
</button>

</div>

<script>

let day = 1;
let gold = 100;
let soldiers = 5;
let castle = 100;

function updateUI(){

    document.getElementById(
    "day").textContent = day;

    document.getElementById(
    "gold").textContent = gold;

    document.getElementById(
    "soldiers").textContent = soldiers;

    document.getElementById(
    "castle").textContent = castle;

}

function log(text){

    document.getElementById(
    "log"
    ).innerHTML =
    text +
    "<br><br>" +
    document.getElementById(
    "log"
    ).innerHTML;

}

function mineGold(){

    const amount =
    Math.floor(
        Math.random()*30
    ) + 10;

    gold += amount;

    log(
    "💰 Collected "
    + amount +
    " Gold"
    );

    updateUI();

}

function trainSoldier(){

    if(gold < 50){

        log(
        "❌ Not enough gold."
        );

        return;
    }

    gold -= 50;

    soldiers++;

    log(
    "⚔ Soldier trained."
    );

    updateUI();

}

function repairCastle(){

    if(gold < 30){

        log(
        "❌ Not enough gold."
        );

        return;
    }

    gold -= 30;

    castle += 15;

    if(castle > 100){
        castle = 100;
    }

    log(
    "🛠 Castle repaired."
    );

    updateUI();

}

function nextDay(){

    day++;

    const enemies =
    Math.floor(
        Math.random()*10
    ) + day;

    log(
    "👹 Enemy army size: "
    + enemies
    );

    if(soldiers >= enemies){

        gold += enemies * 10;

        log(
        "✅ Your army won!"
        );

    }else{

        const damage =
        (enemies - soldiers) * 5;

        castle -= damage;

        log(
        "💥 Castle took "
        + damage +
        " damage!"
        );

    }

    if(castle <= 0){

        document.getElementById(
        "finalDay"
        ).textContent =
        day;

        document.getElementById(
        "gameOver"
        ).style.display =
        "flex";

    }

    updateUI();

}

updateUI();

</script>

</body>
</html>
